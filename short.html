<style>
  :root{ --red:#D8352A; --glow:#ff4433; --ember:#ff7a18; --amber:#ffb020; --grey:#8B8D93; --white:#F4F4F5; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:transparent;overflow:hidden}
  #stage{ position:absolute; inset:0; overflow:hidden; }
  .layer{ position:absolute; inset:0; opacity:0; filter:blur(9px); transform-origin:center;
    transition:opacity .9s ease, filter .9s ease; }
  .layer.show{ opacity:1; filter:blur(0); }
  .layer svg{ display:block; width:100%; height:100%; }
  #flash{ position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(60% 50% at 50% 55%, rgba(255,122,24,.5), transparent 70%); }

  .card{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:8%; }
  .card-logo{ width:80%; max-width:80%; mix-blend-mode:screen; filter:drop-shadow(0 0 34px rgba(216,53,42,.45)); }
  .card-url{ font-family:'Orbitron',sans-serif; color:var(--glow); font-weight:700; letter-spacing:.22em; font-size:clamp(12px,3vw,24px); }
  .card-tag{ font-family:'Orbitron',sans-serif; color:var(--grey); font-weight:600; letter-spacing:.14em; font-size:clamp(8px,1.7vw,13px); }
  .card-in{ animation:cardIn 1.5s ease-out both; }
  @keyframes cardIn{0%{opacity:0;transform:translateY(10px) scale(.95)}100%{opacity:1;transform:none}}

  .layer svg [stroke-dasharray]{animation:dashFlow 2.6s linear infinite}
  @keyframes dashFlow{to{stroke-dashoffset:-24}}
  .layer svg circle[fill="#D8352A"]{transform-box:fill-box;transform-origin:center;animation:hotspot 2.2s ease-in-out infinite}
  @keyframes hotspot{0%,100%{opacity:.65;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}
  .layer svg .smoke>*{transform-box:fill-box;transform-origin:center bottom;animation:smokeRise 3.6s ease-in infinite}
  @keyframes smokeRise{0%{opacity:0;transform:translateY(8px) scale(.5)}25%{opacity:.4}100%{opacity:0;transform:translateY(-46px) scale(1.5)}}
  .layer svg .smokeThick>*{transform-box:fill-box;transform-origin:center bottom;animation:smokeTall 4.6s ease-in infinite}
  @keyframes smokeTall{0%{opacity:0;transform:translateY(10px) scale(.4)}18%{opacity:.55}100%{opacity:0;transform:translateY(-120px) scale(2.1)}}
  .layer svg .grow2{transform-box:fill-box;transform-origin:center bottom;animation:growFire2 6.5s ease-out infinite}
  @keyframes growFire2{0%,46%{transform:scale(.03);opacity:0}72%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
  .layer svg .revealLate{animation:revLate 6.5s infinite}
  @keyframes revLate{0%,52%{opacity:0}66%,100%{opacity:1}}
  .layer svg .emberIn{opacity:0;animation:emberIn 6.5s ease-in infinite}
  @keyframes emberIn{0%,50%{opacity:0}68%,100%{opacity:1}}
  .layer svg .alertP,.layer svg .alertC{transform-box:fill-box}
  .layer svg .alertP{animation:alertP 5.2s ease-out infinite}
  @keyframes alertP{0%{opacity:0;transform:translateY(-6px)}12%,100%{opacity:1;transform:translateY(0)}}
  .layer svg .alertC{animation:alertC 8s linear infinite}
  @keyframes alertC{0%,50%{opacity:0;transform:translateY(-6px)}56%,100%{opacity:1;transform:translateY(0)}}
</style>
</head>

  var TXR=900;

  var seq=[
    ['title',4200],['s1',5200],['s2',6500],['s3',5200],['s4',8000],['s5',8000],['end',4600]
  ];

  function stopCounter(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }
  function startCounter(root){
    var pct=root.querySelector('.s5pct'), bar=root.querySelector('.s5bar');
    var t0=performance.now(), DUR=8000;
    function fr(now){
      var t=Math.min(1,(now-t0)/DUR), v;
      if(t<0.4){ v=20; } else { v=Math.round(20+30*Math.min(1,(t-0.4)/0.55)); }
      if(pct) pct.textContent='CONTAINED: '+v+'%';
      if(bar) bar.setAttribute('width',(2+(v-20)/30*152).toFixed(1));
      if(t<1) rafId=requestAnimationFrame(fr);
    }
    rafId=requestAnimationFrame(fr);
  }

  function activate(i){
    var name=seq[i][0], cyc=seq[i][1];
    var inL=layers[(cur+1)%2], outL=layers[cur];
    inL.innerHTML = document.getElementById('tpl-'+name).innerHTML;
    if(inL._push){ inL._push.cancel(); }
    if(inL.animate){ inL._push=inL.animate([{transform:'scale(1)'},{transform:'scale(1.05)'}],{duration:cyc, easing:'linear', fill:'forwards'}); }
    stopCounter();
    if(name==='s5'){ startCounter(inL); }
    void inL.offsetWidth;
    inL.classList.add('show'); outL.classList.remove('show');
    if(i>0 && flash.animate){ flash.animate([{opacity:0},{opacity:0.10},{opacity:0}],{duration:900, easing:'ease-out'}); }
    cur=(cur+1)%2;
    var next=(i<seq.length-1)?(i+1):0;          // loop forever
    timer=setTimeout(function(){ activate(next); }, cyc-TXR);
  }

  function play(){
    clearTimeout(timer); stopCounter();
    layers.forEach(function(l){ if(l._push) l._push.cancel(); l.classList.remove('show'); l.innerHTML=''; });
    cur=0; activate(0);
  }

  if(document.readyState==='complete'){ play(); }
  else { window.addEventListener('load', play); }
})();
</script>
</body>
</html>
